name: Test Copilot tests

on:
  push:
    branches: [main]
    paths:
      - 'testcopilot/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'testcopilot/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile sources
        run: python -m compileall -q testcopilot tests
      - name: Run unit tests
        run: pytest -q
