name: Expand project source bundle

on:
  push:
    branches: [main]
    paths:
      - '.source_parts/**'
      - '.github/workflows/unpack-source.yml'

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and expand the source archive
        run: |
          python - <<'PY'
          import base64
          import io
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          source_dir = Path(".source_parts")
          expected = {
              "part00.txt": 5000,
              "part01.txt": 5000,
              "part02.txt": 5000,
              "part03a.txt": 2500,
              "part03b.txt": 2500,
              "part04.txt": 5000,
              "part05.txt": 4176,
          }
          actual = {p.name: len(p.read_text(encoding="ascii").strip()) for p in source_dir.glob("*.txt")}
          if actual != expected:
              raise SystemExit(f"Unexpected source chunk set/sizes: {actual}")

          encoded = "".join((source_dir / name).read_text(encoding="ascii").strip()
                            for name in expected)
          archive_bytes = base64.b64decode(encoded, validate=True)
          if len(archive_bytes) == 0:
              raise SystemExit("Decoded archive is empty")

          prefix = "openapi_test_copilot/"
          output_root = Path(".").resolve()
          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:xz") as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit("Archive has no members")
              for member in members:
                  if member.name != "openapi_test_copilot" and not member.name.startswith(prefix):
                      raise SystemExit(f"Unexpected archive member: {member.name}")
                  relative = PurePosixPath("" if member.name == "openapi_test_copilot" else member.name[len(prefix):])
                  if relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit(f"Unsafe archive path: {member.name}")
                  if member.issym() or member.islnk() or not (member.isdir() or member.isfile()):
                      raise SystemExit(f"Unsupported archive member: {member.name}")
                  if member.isdir() or not relative.parts:
                      continue
                  target = (output_root / Path(*relative.parts)).resolve()
                  if output_root not in target.parents:
                      raise SystemExit(f"Archive path escapes repository: {member.name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"Cannot read archive member: {member.name}")
                  target.write_bytes(stream.read())

          required = [
              Path("testcopilot/generator.py"),
              Path("testcopilot/cli.py"),
              Path("tests/test_generator.py"),
              Path("examples/marketplace.openapi.json"),
              Path("requirements.txt"),
              Path("README.md"),
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit(f"Expanded source is incomplete: {missing}")

          shutil.rmtree(source_dir)
          print(f"Expanded {len(members)} validated archive entries ({len(archive_bytes)} bytes).")
          PY

      - name: Validate Python syntax
        run: python -m compileall -q testcopilot tests

      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add OpenAPI Test Copilot source files"
          git push
